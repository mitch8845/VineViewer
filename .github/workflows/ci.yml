name: CI

# Fast feedback on every push. Deliberately does NOT sign or publish -- this
# only answers "does it still build and pass?" so a broken main is caught
# before you tag a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # *.g.dart is gitignored, so nothing compiles until this runs.
      - name: Generate code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      # Last on purpose: a whitespace failure should not skip analyze, test,
      # and build. Reproduce locally with the same command.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
