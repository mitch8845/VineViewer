name: CI

# Fast feedback on every push. Deliberately does NOT sign or publish -- this
# only answers "does it still build and pass?" so a broken main is caught
# before you tag a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      # NOTE: no `dart format --set-exit-if-changed` step.
      # dart format hangs indefinitely on the development machine (as do
      # flutter analyze and flutter test), so a formatting failure here could
      # not be reproduced or fixed locally -- every push would be a guess.
      # A check you cannot satisfy locally is worse than no check.
      # Restore it once that hang is resolved.
